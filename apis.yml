- type: Integrations
  data:
  - name: Adobe Commerce (Magento)
    description: Pre-built plugin for Adobe Commerce and Magento e-commerce platforms
      with full payment method support.
  - name: Salesforce Commerce Cloud
    description: Integration with Salesforce Commerce Cloud for seamless payment processing
      in SFCC storefronts.
  - name: Shopware
    description: Native plugin for Shopware e-commerce platform supporting all Adyen
      payment methods.
  - name: SAP Commerce Cloud
    description: Integration with SAP Commerce Cloud for enterprise e-commerce payment
      processing.
  - name: Shopify
    description: Partner integration with Shopify for accepting Adyen payments through
      Shopify stores.
  - name: NetSuite
    description: Integration with Oracle NetSuite ERP for payment processing and reconciliation.
  - name: PrestaShop
    description: Plugin for PrestaShop e-commerce platform enabling Adyen payment
      acceptance.
  - name: CommerceTools
    description: Integration with CommerceTools headless commerce platform for flexible
      payment experiences.
