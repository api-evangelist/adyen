- type: Features
  data:
  - $0.13 fixed processing fee per transaction (no setup/monthly fees)
  - 'Visa/Mastercard: $0.13 + Interchange++ + 0.60%'
  - 'PayPal: $0.13 + direct contract + management fee'
  - 'Klarna: $0.13 + 0.99%-4.99% + currency-specific fees'
  - 'Affirm: $0.13 + 4.19%-5.19% + $0.30'
  - 100 RPS API rate limit per merchant
  - Single integration for 100+ payment methods
  - Interchange++ transparent pricing
  - Flexible payout timing and currency
  - REST API for Payments, Recurring, Modifications
  - Webhooks for transaction events
  - Adyen Drop-In and Components for UI
  - Risk and Revenue Accelerate add-ons
  - Capital and Issuing for embedded finance
  - POS terminals (hardware separate)
  - Custom enterprise contracts with volume discounts
  sources:
  - https://www.adyen.com/pricing
  updated: '2026-05-04'
- type: UseCases
  data:
  - name: Online Checkout
    description: Accept payments on web and mobile with Drop-in or Components, supporting
      all major payment methods and currencies.
  - name: Point-of-Sale Payments
    description: Process in-person payments using Adyen's Terminal API and supported
      payment terminals with tap, dip, and swipe capabilities.
  - name: Subscription and Recurring Billing
    description: Manage recurring payments and subscriptions using stored payment
      methods and tokenization.
  - name: Marketplace and Platform Payouts
    description: Onboard sub-merchants, split payments, and manage payouts to sellers
      and service providers on marketplace platforms.
  - name: Buy Now Pay Later
    description: Offer BNPL options including Affirm, Afterpay, and Klarna to shoppers
      at checkout to increase conversion.
  - name: Gift Cards and Stored Value
    description: Issue and manage gift cards and stored value products with balance
      inquiry, load, and redemption capabilities.
  - name: Dispute and Chargeback Management
    description: Automate dispute handling processes to respond to chargebacks with
      defense documents and evidence.
  - name: GDPR Data Erasure
    description: Process subject erasure requests to comply with GDPR right-to-be-forgotten
      requirements for shopper data.
