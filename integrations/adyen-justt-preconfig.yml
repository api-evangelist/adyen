arazzo: 1.0.1
info:
  title: 'adyen through justt: TransactionController_createTransaction preconfigured with adyen'
  summary: Calls justt's TransactionController_createTransaction with `adyen` preset, the way adyen is used inside
    justt.
  description: 'A PRECONFIGURATION, not an orchestration: adyen is a processor-connection inside justt, so the integration
    is justt''s own operation with adyen''s enum value set. Derived from justt''s contract (justt-transactions-api-openapi.yml);
    required properties are inputs.'
  version: 1.0.0
x-integration:
  partner: justt
  relationship: processor-connection
  preconfig: true
  edge_evidence: https://github.com/api-evangelist/justt/blob/main/openapi/justt-transactions-api-openapi.yml
  edge_type: contract
  preset:
    psp: adyen
  method: derived
  generated: '2026-10-12'
  generator: build-integration-preconfigs.py
sourceDescriptions:
- name: justtTransactionsApiOpenapi
  url: https://raw.githubusercontent.com/api-evangelist/justt/refs/heads/main/openapi/justt-transactions-api-openapi.yml
  type: openapi
workflows:
- workflowId: adyen-via-justt-transactioncontroller-createtransaction
  summary: TransactionController_createTransaction with adyen preset
  inputs:
    type: object
    required:
    - transactionId
    properties:
      transactionId:
        type: string
  steps:
  - stepId: call-with-preset
    operationId: $sourceDescriptions.justtTransactionsApiOpenapi.TransactionController_createTransaction
    requestBody:
      contentType: application/json
      payload:
        transactionId: $inputs.transactionId
        psp: adyen
    successCriteria:
    - condition: $statusCode == 201
    outputs:
      id: $response.body#/id
  outputs:
    id: $steps.call-with-preset.outputs.id
