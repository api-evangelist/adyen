name: Adyen API error codes
generated: '2026-10-12'
method: searched
source: https://docs.adyen.com/development-resources/error-codes
format: adyen-error-envelope
envelope:
  fields:
  - status
  - errorCode
  - message
  - errorType
  - pspReference
  errorType_values:
  - internal
  - validation
  - security
  - configuration
note: Adyen error codes are returned with a non-2xx HTTP status; the page does not map each errorCode to a single HTTP status, so status is the example value from the page (422) only for the envelope.
problems:
- status: non-2xx
  code: '000'
  title: Multiple messages
- status: non-2xx
  code: '010'
  title: Not allowed
  description: '* The API credential is missing required roles. * The user API is incorrect. * You are making a third-party payment or card acquisition request to your terminals.'
- status: non-2xx
  code: '100'
  title: Required object 'amount' is not provided
  description: Missing parameter
  remediation: '* Add the missing parameter(s) `amount` or `originalReference`. * Compare your request with a standard request for that endpoint, and identify missing parameters.'
- status: non-2xx
  code: '101'
  title: Invalid card number
  description: '* Incorrect card number or length. * Incorrect capitalization of `PaRes`.'
- status: non-2xx
  code: '102'
  title: Unable to determine variant
  description: The card number field contains an incorrect value.
- status: non-2xx
  code: '103'
  title: CVC is not the right length
  description: '* The Card Validation Code (CVC) is not valid. * The CVC is alphanumeric instead of numeric-only. * There are more than three digits. * (American Express) There are more than four digits.'
- status: non-2xx
  code: '104'
  title: Billing address problem
  description: Missing a required field under `billingAddress`.
  remediation: Check the `billingAddress` object for missing fields.
- status: non-2xx
  code: '105'
  title: Invalid paRes from issuer
  description: The issuer returns an URL-encoded `PaRes` or `MD`.
  remediation: 'URL-decode the `PaRes` and `MD` before submitting them in the /payments/details request. * **Cause**: The issuer returns the correct `PaRes` value, but the parameter name is different from
    `PaRes`, for example `PaResponse` or `paRes` **Solution**: Adyen only accepts this parameter as `PaRes`. If the issuer has returned something different, make sure that you change it to `PaRes` before
    submitting '
