# Adyen Conceptual GraphQL Schema
# Derived from Adyen REST API types (Checkout, Payments, Payouts, Recurring,
# Transfers, Balance Platform, Management, Legal Entity, Disputes, Notifications)
# This is a conceptual schema — Adyen does not offer a native GraphQL endpoint.

scalar DateTime
scalar JSON

# ─── Enums ────────────────────────────────────────────────────────────────────

enum PaymentResultCode {
  Authorised
  Cancelled
  ChallengeShopper
  Error
  IdentifyShopper
  Pending
  PresentToShopper
  Received
  RedirectShopper
  Refused
}

enum ShopperInteraction {
  Ecommerce
  ContAuth
  Moto
  POS
}

enum RecurringProcessingModel {
  CardOnFile
  Subscription
  UnscheduledCardOnFile
}

enum FundOrigin {
  BankAccount
  Card
  Unknown
}

enum TransactionStatus {
  Booked
  Pending
  Returned
  Unknown
}

enum DisputeStatus {
  Open
  Closed
  Won
  Lost
  UnderReview
}

enum NotificationEventCode {
  AUTHORISATION
  CAPTURE
  CAPTURE_FAILED
  CANCELLATION
  REFUND
  REFUND_FAILED
  CHARGEBACK
  CHARGEBACK_REVERSED
  DISPUTE_OPENED
  PAYOUT_THIRDPARTY
  REPORT_AVAILABLE
  ORDER_OPENED
  ORDER_CLOSED
  RECURRING_CONTRACT
}

enum TerminalStatus {
  Online
  Offline
  Reassigning
  Unknown
}

enum AccountHolderStatus {
  Active
  Inactive
  Suspended
  Closed
}

enum LegalEntityType {
  Individual
  Organization
  SoleProprietorship
  Trust
}

enum DocumentType {
  PASSPORT
  ID_CARD
  DRIVING_LICENSE
  BANK_STATEMENT
  PROOF_OF_RESIDENCE
  UTILITY_BILL
  COMPANY_REGISTRATION
  CONSTITUTION
}

enum SplitType {
  BalanceAccount
  Commission
  Default
  MarketPlace
  PaymentFee
  Remainder
  Surcharge
  Tip
  VAT
}

enum BalanceAccountStatus {
  Active
  Closed
  Suspended
}

enum PaymentLinkStatus {
  Active
  Expired
  Completed
  PaymentPending
}

enum RefundReason {
  FRAUD
  CUSTOMER_REQUEST
  RETURN
  DUPLICATE
  OTHER
}

