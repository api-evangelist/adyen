# ─── Queries ──────────────────────────────────────────────────────────────────

type Query {
  # Payment methods
  paymentMethods(merchantAccount: String!, countryCode: String, shopperLocale: String, channel: String, amount: Int, currency: String): [PaymentMethod]

  # Stored payment methods
  storedPaymentMethods(merchantAccount: String!, shopperReference: String!): [StoredPaymentMethod]

  # Payment link
  paymentLink(id: String!): PaymentLink
  paymentLinks(merchantAccount: String!, status: PaymentLinkStatus, createdSince: DateTime, createdUntil: DateTime): [PaymentLink]

  # Orders
  order(orderData: String!, pspReference: String!): Order

  # Checkout session
  checkoutSession(sessionId: String!): CheckoutResult

  # Payout
  payoutDetails(shopperReference: String!, merchantAccount: String!): [StoredPaymentMethod]

  # Recurring
  recurringDetails(merchantAccount: String!, shopperReference: String!): [StoredPaymentMethod]

  # Account holder (classic marketplaces)
  accountHolder(accountHolderCode: String!): AccountHolder
  accountHolders(merchantAccount: String!, status: AccountHolderStatus): [AccountHolder]

  # Account
  account(accountCode: String!): Account

  # Transfer
  transfer(id: String!): Transfer
  transfers(merchantAccount: String, balanceAccountId: String, status: TransactionStatus, createdSince: DateTime, createdUntil: DateTime, cursor: String, limit: Int): TransferPage

  # Balance platform / marketplace account
  marketplaceAccount(id: String!): MarketplaceAccount
  marketplaceAccounts(accountHolderId: String): [MarketplaceAccount]

  # Balance
  balances(balanceAccountId: String!): [Balance]

  # Merchant account
  merchantAccount(merchantAccount: String!): MerchantAccount
  merchantAccounts(companyId: String!): [MerchantAccount]

  # Business line
  businessLine(id: String!): BusinessLine
  businessLines(legalEntityId: String): [BusinessLine]

  # Legal entity
  legalEntity(id: String!): LegalEntity
  legalEntities(associatedWithMerchantAccount: String): [LegalEntity]

  # Document
  document(id: String!): Document

  # Terminal
  terminal(id: String!): Terminal
  terminals(merchantAccount: String, storeId: String, status: TerminalStatus): [Terminal]

  # Store
  store(id: String!): StoreDetails
  stores(merchantAccount: String!): [StoreDetails]

  # Dispute
  disputes(merchantAccount: String!, disputeStatus: DisputeStatus, createdSince: DateTime, createdUntil: DateTime): [DisputeData]
  dispute(pspReference: String!, merchantAccount: String!): DisputeData
  defenseReasons(pspReference: String!, merchantAccount: String!): [DefenseReason]

  # Notification webhooks
  webhookConfig(id: String!, merchantAccount: String!): WebhookConfig
  webhookConfigs(merchantAccount: String!): [WebhookConfig]

  # Reports
  report(id: String!): Report
  reports(merchantAccount: String!, reportType: String, createdSince: DateTime, createdUntil: DateTime): [Report]

  # Transfer instrument
  transferInstrument(id: String!): TransferInstrument
  transferInstruments(legalEntityId: String!): [TransferInstrument]

  # Networks
  networks(merchantAccount: String!): [Network]
}

# ─── Mutations ────────────────────────────────────────────────────────────────

type Mutation {
  # Payment
  makePayment(input: PaymentRequestInput!): PaymentResponse
  submitPaymentDetails(input: PaymentDetailsInput!): PaymentResponse

  # Checkout session
  createCheckoutSession(input: CreateCheckoutSessionInput!): CheckoutResult

  # Modifications
  capturePayment(pspReference: String!, merchantAccount: String!, amount: Amount!, reference: String, splits: [SplitItemInput]): Capture
  cancelPayment(pspReference: String!, merchantAccount: String!, reference: String): Cancellation
  refundPayment(pspReference: String!, merchantAccount: String!, amount: Amount!, reference: String, splits: [SplitItemInput], lineItems: [LineItemInput]): Refund
  voidPendingRefund(pspReference: String!, merchantAccount: String!): VoidPending
  cancelOrRefundPayment(pspReference: String!, merchantAccount: String!, reference: String): PaymentResponse

  # Payment link
  createPaymentLink(input: CreatePaymentLinkInput!): PaymentLink
  updatePaymentLink(id: String!, status: PaymentLinkStatus!): PaymentLink

  # Payout
  storePayout(input: PayoutRequestInput!): PayoutResult
  submitPayout(input: PayoutRequestInput!): PayoutResult
  confirmPayout(originalReference: String!, merchantAccount: String!): PayoutResult
  declinePayout(originalReference: String!, merchantAccount: String!): PayoutResult

  # Stored payment methods
  disableStoredPaymentMethod(shopperReference: String!, merchantAccount: String!, recurringDetailReference: String): String
  tokenizePayment(input: TokenizationInput!): StoredPaymentMethod

  # Account holder (classic)
  createAccountHolder(input: CreateAccountHolderInput!): AccountHolder
  updateAccountHolder(accountHolderCode: String!, input: UpdateAccountHolderInput!): AccountHolder
  suspendAccountHolder(accountHolderCode: String!): AccountHolder
  unsuspendAccountHolder(accountHolderCode: String!): AccountHolder
  closeAccountHolder(accountHolderCode: String!): AccountHolder

  # Account
  createAccount(accountHolderCode: String!, description: String): Account
  updateAccount(accountCode: String!, description: String, payoutSchedule: String): Account
  closeAccount(accountCode: String!): Account

  # Fund transfer
  transferFunds(sourceAccountCode: String!, destinationAccountCode: String!, amount: Amount!, transferCode: String!, description: String): Fund
  payoutToAccountHolder(accountHolderCode: String!, accountCode: String!, amount: Amount!, description: String): Fund

  # Marketplace account
  createMarketplaceAccount(input: CreateMarketplaceAccountInput!): MarketplaceAccount
  updateMarketplaceAccount(id: String!, description: String, reference: String, metadata: JSON): MarketplaceAccount
  closeMarketplaceAccount(id: String!): MarketplaceAccount

  # Business line
  createBusinessLine(input: CreateBusinessLineInput!): BusinessLine
  updateBusinessLine(id: String!, input: UpdateBusinessLineInput!): BusinessLine
  deleteBusinessLine(id: String!): Boolean

  # Legal entity
  createLegalEntity(input: CreateLegalEntityInput!): LegalEntity
  updateLegalEntity(id: String!, input: UpdateLegalEntityInput!): LegalEntity

  # Document
  uploadDocument(input: UploadDocumentInput!): Document
  deleteDocument(id: String!): Boolean

  # Terminal
  assignTerminal(terminalId: String!, merchantAccount: String!, storeId: String): Terminal
  reassignTerminalToInventory(terminalId: String!, companyId: String!): Terminal

  # Store
  createStore(merchantAccount: String!, input: CreateStoreInput!): StoreDetails
  updateStore(id: String!, merchantAccount: String!, input: UpdateStoreInput!): StoreDetails

  # Dispute
  acceptDispute(pspReference: String!, merchantAccount: String!): CaseStatus
  defendDispute(pspReference: String!, merchantAccount: String!, defenseReasonCode: String!, documents: [DefenseDocumentInput!]!): CaseStatus
  uploadDefenseDocument(pspReference: String!, merchantAccount: String!, document: DefenseDocumentInput!): Boolean
  deleteDefenseDocument(pspReference: String!, merchantAccount: String!, defenseDocumentTypeCode: String!): Boolean

  # Webhooks
  createWebhook(merchantAccount: String!, input: CreateWebhookInput!): WebhookConfig
  updateWebhook(id: String!, merchantAccount: String!, input: UpdateWebhookInput!): WebhookConfig
  deleteWebhook(id: String!, merchantAccount: String!): Boolean
  testWebhook(id: String!, merchantAccount: String!): WebhookTestResult
  generateWebhookHmac(id: String!, merchantAccount: String!): String

  # Data protection (GDPR erasure)
  requestDataErasure(shopperReference: String!, merchantAccount: String!, forceErasure: Boolean): Boolean

  # Transfer instrument
  createTransferInstrument(legalEntityId: String!, input: CreateTransferInstrumentInput!): TransferInstrument
  updateTransferInstrument(id: String!, input: UpdateTransferInstrumentInput!): TransferInstrument
  deleteTransferInstrument(id: String!): Boolean
}

# ─── Input Types ──────────────────────────────────────────────────────────────

input AmountInput {
  currency: String!
  value: Int!
}

input AddressInput {
  city: String
  country: String!
  houseNumberOrName: String
  postalCode: String
  stateOrProvince: String
  street: String
}

input NameInput {
  firstName: String!
  lastName: String!
  gender: String
  infix: String
}

input LineItemInput {
  id: String
  description: String
  amountExcludingTax: Int
  amountIncludingTax: Int
  taxAmount: Int
  taxPercentage: Int
  quantity: Int
}

input SplitItemInput {
  account: String
  amount: AmountInput
  description: String
  reference: String
  type: SplitType!
}

input PaymentRequestInput {
  amount: AmountInput!
  merchantAccount: String!
  reference: String!
  returnUrl: String
  paymentMethod: JSON!
  billingAddress: AddressInput
  deliveryAddress: AddressInput
  shopperEmail: String
  shopperIP: String
  shopperLocale: String
  shopperReference: String
  shopperInteraction: ShopperInteraction
  recurringProcessingModel: RecurringProcessingModel
  storePaymentMethod: Boolean
  channel: String
  origin: String
  countryCode: String
  lineItems: [LineItemInput]
  splits: [SplitItemInput]
  metadata: JSON
}

input PaymentDetailsInput {
  details: JSON!
  paymentData: String
  threeDSAuthenticationOnly: Boolean
}

input CreateCheckoutSessionInput {
  amount: AmountInput!
  merchantAccount: String!
  reference: String!
  returnUrl: String!
  countryCode: String
  shopperLocale: String
  shopperEmail: String
  shopperReference: String
  channel: String
  lineItems: [LineItemInput]
  allowedPaymentMethods: [String]
  expiresAt: DateTime
}

input CreatePaymentLinkInput {
  amount: AmountInput!
  merchantAccount: String!
  reference: String!
  description: String
  shopperEmail: String
  shopperReference: String
  countryCode: String
  shopperLocale: String
  expiresAt: DateTime
  lineItems: [LineItemInput]
  billingAddress: AddressInput
  allowedPaymentMethods: [String]
  recurringProcessingModel: RecurringProcessingModel
  reusable: Boolean
}

input PayoutRequestInput {
  amount: AmountInput!
  merchantAccount: String!
  reference: String!
  shopperReference: String!
  shopperEmail: String
  recurringDetailReference: String
  entityType: String
  nationality: String
  dateOfBirth: String
}

input TokenizationInput {
  shopperReference: String!
  merchantAccount: String!
  paymentMethod: JSON!
  recurringProcessingModel: RecurringProcessingModel
  shopperEmail: String
  channel: String
}

input CreateAccountHolderInput {
  accountHolderCode: String!
  legalEntity: LegalEntityType!
  accountHolderDetails: AccountHolderDetailsInput!
  primaryCurrency: String
  processingTier: Int
}

input AccountHolderDetailsInput {
  email: String
  fullPhoneNumber: String
  webAddress: String
  address: AddressInput
}

input UpdateAccountHolderInput {
  accountHolderDetails: AccountHolderDetailsInput
  primaryCurrency: String
  processingTier: Int
  description: String
}

input CreateMarketplaceAccountInput {
  accountHolderId: String!
  description: String
  reference: String
  metadata: JSON
  timeZone: String
}

input CreateBusinessLineInput {
  capability: String!
  legalEntityId: String!
  service: String!
  industry: String
  salesChannels: [String]
  webData: [WebDataInput]
}

input UpdateBusinessLineInput {
  capability: String
  industry: String
  salesChannels: [String]
  webData: [WebDataInput]
}

input WebDataInput {
  webAddress: String!
}

input CreateLegalEntityInput {
  type: LegalEntityType!
  individual: IndividualInput
  organization: OrganizationInput
  reference: String
}

input UpdateLegalEntityInput {
  individual: IndividualInput
  organization: OrganizationInput
  reference: String
}

input IndividualInput {
  name: NameInput
  email: String
  nationality: String
  dateOfBirth: String
  residentialAddress: AddressInput
}

input OrganizationInput {
  legalName: String!
  registrationNumber: String
  vatNumber: String
  taxInformation: [TaxInformationInput]
  principalAddress: AddressInput
  registeredAddress: AddressInput
}

input TaxInformationInput {
  country: String!
  number: String!
  type: String
}

input UploadDocumentInput {
  type: DocumentType!
  ownerId: String!
  ownerType: LegalEntityType!
  number: String
  expiryDate: String
  issuingCountry: String
  content: String!
  contentType: String!
  filename: String
}

input CreateStoreInput {
  reference: String!
  description: String
  shopperStatement: String
  address: AddressInput!
  phoneNumber: String
  businessLineIds: [String]
}

input UpdateStoreInput {
  description: String
  shopperStatement: String
  address: AddressInput
  phoneNumber: String
  status: String
  businessLineIds: [String]
}

input DefenseDocumentInput {
  content: String!
  contentType: String!
  defenseDocumentTypeCode: String!
  filename: String
}

input CreateWebhookInput {
  type: String!
  url: String!
  username: String
  password: String
  active: Boolean!
  communicationFormat: String
  encryptionProtocol: String
  networkType: String
  populateSoapActionHeader: Boolean
  filterMerchantAccountType: String
  filterMerchantAccounts: [String]
  additionalSettings: WebhookAdditionalSettingsInput
}

input UpdateWebhookInput {
  url: String
  username: String
  password: String
  active: Boolean
  communicationFormat: String
  encryptionProtocol: String
  networkType: String
  filterMerchantAccountType: String
  filterMerchantAccounts: [String]
  additionalSettings: WebhookAdditionalSettingsInput
}

input WebhookAdditionalSettingsInput {
  includeEventCodes: [String]
  excludeEventCodes: [String]
  properties: JSON
}

input CreateTransferInstrumentInput {
  type: String!
  bankAccount: BankAccountInput
}

input UpdateTransferInstrumentInput {
  bankAccount: BankAccountInput
}

input BankAccountInput {
  iban: String
  bankAccountNumber: String
  bankLocationId: String
  bic: String
  countryCode: String!
  ownerName: String!
}

# ─── Pagination ───────────────────────────────────────────────────────────────

type TransferPage {
  data: [Transfer]
  hasNext: Boolean!
  nextCursor: String
}

# ─── Auxiliary Results ────────────────────────────────────────────────────────

type WebhookTestResult {
  status: String
  data: [WebhookTestData]
}

type WebhookTestData {
  eventCode: String
  merchantCode: String
  response: String
  success: Boolean
}
