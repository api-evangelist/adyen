          description: 'Format or protocol for receiving webhooks. Possible values:

            * **soap**

            * **http**

            * **json** '
          enum:
          - http
          - json
          - soap
          example: soap
          type: string
        description:
          description: Your description for this webhook configuration.
          type: string
        encryptionProtocol:
          x-addedInVersion: '2'
          description: 'SSL version to access the public webhook URL specified in the `url` field. Possible values:

            * **TLSv1.3**

            * **TLSv1.2**

            * **HTTP** - Only allowed on Test environment.


            If not specified, the webhook will use `sslVersion`: **TLSv1.2**.'
          enum:
          - HTTP
          - TLSv1.2
          - TLSv1.3
          example: TLSv1.2
          type: string
        filterMerchantAccountType:
          description: 'Shows how merchant accounts are filtered when configuring the webhook. Possible values:

            * **includeAccounts**: The webhook is configured for the merchant accounts listed in `filterMerchantAccounts`.

            * **excludeAccounts**: The webhook is not configured for the merchant accounts listed in `filterMerchantAccounts`.

            * **allAccounts**: Includes all merchant accounts, and does not require specifying `filterMerchantAccounts`.'
          enum:
          - allAccounts
          - excludeAccounts
          - includeAccounts
          type: string
        filterMerchantAccounts:
          description: 'A list of merchant account names that are included or excluded from receiving the webhook. Inclusion or exclusion is based on the value defined for `filterMerchantAccountType`.


            Required if `filterMerchantAccountType` is either:

            * **includeAccounts**

            * **excludeAccounts**


            Not needed for `filterMerchantAccountType`: **allAccounts**.'
          items:
            type: string
          type: array
        networkType:
          description: 'Network type for Terminal API notification webhooks. Possible values:

            * **public**

            * **local**


            Default Value: **public**.'
          enum:
          - local
          - public
          type: string
        password:
          description: Password to access the webhook URL.
          type: string
        populateSoapActionHeader:
          description: 'Indicates if the SOAP action header needs to be populated. Default value: **false**.


            Only applies if `communicationFormat`: **soap**.'
          type: boolean
        url:
          description: Public URL where webhooks will be sent, for example **https://www.domain.com/webhook-endpoint**.
          example: http://www.adyen.com
          type: string
        username:
          description: Username to access the webhook URL.
          maxLength: 255
          type: string
      type: object
    Merchant:
