        description: YOUR_DESCRIPTION
        bankAccountUUID: 000b81aa-ae7e-4492-aa7e-72b2129dce0c
        amount:
          value: 6200
          currency: USD
        merchantAccount: YOUR_MERCHANT_ACCOUNT
