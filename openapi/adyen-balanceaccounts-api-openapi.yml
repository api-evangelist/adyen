          type: string
        password:
          description: 'The password used for 3D Secure password-based authentication. The value must be between 1 to 30 characters and must only contain the following supported characters.


            * Characters between **a-z**, **A-Z**, and **0-9**


            * Special characters: **äöüßÄÖÜ+-*/ç%()=?!~#''",;:$&àùòâôûáúó**'
          maxLength: 30
          minLength: 1
          type: string
        phone:
