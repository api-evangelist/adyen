  /payments:
    post:
      tags:
      - Payments
      summary: Adyen Start a Transaction
      description: 'Sends payment parameters (like amount, country, and currency) together with other required input details collected from the shopper. To know more about required parameters for specific payment methods, refer to our payment method guides.

        The response depends on the payment flow:

        * For a direct flow, the response includes a `pspReference` and a `resultCode` with the payment result, for example **Authorised** or **Refused**.

        * For a redirect or additional action, the response contains an `action` object.'
      operationId: post-payments
      x-sortIndex: 3
      x-methodName: payments
      security:
      - BasicAuth: []
      - ApiKeyAuth: []
      requestBody:
        content:
          application/json:
            examples:
              applepay:
                $ref: '#/components/examples/post-payments-applepay'
              card-3d-secure-2-web:
                $ref: '#/components/examples/post-payments-card-3d-secure-2-web'
