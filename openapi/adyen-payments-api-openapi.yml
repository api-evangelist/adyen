  /payments/{paymentPspReference}/reversals:
    post:
      tags:
      - Payments
      summary: Adyen Refund or Cancel a Payment
      description: 'Refunds a payment if it has already been captured, and cancels a payment if it has not yet been captured. Returns a unique reference for this request. You get the outcome of the request asynchronously, in a **CANCEL_OR_REFUND** webhook.


        The reversed amount is always the full payment amount.

        > Do not use this request for payments that involve multiple partial captures.


        For more information, refer to Reversal.'
      operationId: post-payments-paymentPspReference-reversals
      x-sortIndex: 5
      x-methodName: refundOrCancelPayment
      security:
      - BasicAuth: []
      - ApiKeyAuth: []
      requestBody:
