    patch:
      tags:
      - Documents
      summary: Adyen Update a Document
      description: 'Updates a document.


        >You can upload a maximum of 15 pages for photo IDs.'
      x-addedInVersion: '1'
      operationId: patch-documents-id
      x-sortIndex: 6
      x-methodName: updateDocument
      security:
      - BasicAuth: []
