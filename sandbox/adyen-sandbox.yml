generated: '2026-07-14'
method: searched
source: https://docs.adyen.com/development-resources/test-cards-and-credentials/test-card-numbers
description: >-
  Adyen's sandbox / test-data surface — the credentials, magic values, and
  simulation triggers a developer needs to exercise the API end-to-end without
  moving real money. Captured verbatim from Adyen's test-cards-and-credentials
  docs and the refusal-reasons reference. Adyen separates test and live by a
  dedicated test Customer Area, test API credentials, and per-service test
  hostnames (…-test.adyen.com); these test card numbers only work on Adyen's
  test platform.
docs:
  - https://docs.adyen.com/development-resources/test-cards-and-credentials
  - https://docs.adyen.com/development-resources/test-cards-and-credentials/test-card-numbers
  - https://docs.adyen.com/development-resources/refusal-reasons
  - https://docs.adyen.com/development-resources/testing/payments-and-modifications

modes:
  - name: test
    hostnames:
      - checkout-test.adyen.com
      - pal-test.adyen.com
      - cal-test.adyen.com
      - ca-test.adyen.com
      - kyc-test.adyen.com
      - management-test.adyen.com
      - balanceplatform-api-test.adyen.com
      - terminal-api-test.adyen.com
    notes: >-
      Isolated from live data. Reached via the test Customer Area
      (ca-test.adyen.com) with test API credentials (API key / basic auth) and a
      test client key. No real cards are ever charged. Card credentials can be
      prefixed with test_ to force server-side test behavior.
  - name: live
    hostnames:
      - "{PREFIX}-checkout-live.adyenpayments.com"
      - "{PREFIX}-pal-live.adyenpayments.com"
    notes: >-
      Live endpoints embed a merchant-specific {PREFIX} (live URL prefix) issued
      in the live Customer Area. Separate live API credentials and client key.

credentials:
  api_key_header: X-API-Key
  test_customer_area: https://ca-test.adyen.com
  client_key: >-
    Public client-side key used by Web/Mobile Drop-in and Components; test and
    live variants issued in the Customer Area.
  server_side_test_prefix: >-
    Prefix test card credentials with test_ to test API calls from your server
    before the client-side integration is ready.

# Standard values that apply to every test card unless the row overrides them.
test_card_conventions:
  expiry: 03/2030
  cvc: '737'
  amex_cid: '7373'
  note: >-
    Any future expiry / any CVC is generally accepted, but the docs publish
    03/2030 and 737 (7373 for Amex) as the canonical values. Only valid on
    Adyen's test platform.

