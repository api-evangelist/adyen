# Adyen does not expose "always-decline" PANs the way some processors do; instead
# you drive a specific refusal by requesting a test amount that maps to a refusal
# reason, or by using the Test Cards API to mint cards bound to an outcome.
decline_simulation:
  mechanism: >-
    In the test environment, trigger a refusal by submitting a payment whose
    value maps to a refusalReasonCode, or generate custom test cards bound to an
    outcome with the Test Cards API. The response carries resultCode +
    refusalReason + refusalReasonCode.
  reference: errors/adyen-decline-codes.yml
  custom_test_cards_api: https://docs.adyen.com/development-resources/test-cards-and-credentials/create-test-cards
  common_test_amounts:
    note: >-
      Test amounts that force a result are documented per payment method; do not
      assume a fixed table — see the testing-payments-and-modifications page.
    docs: https://docs.adyen.com/development-resources/testing/payments-and-modifications

three_d_secure:
  docs: https://docs.adyen.com/online-payments/3d-secure/test-3d-secure
  note: >-
    Dedicated 3D Secure 2 test cards and challenge/frictionless flows are
    published on the 3D Secure testing page; the Maestro test card above requires
    3D Secure.

test_tooling:
  browser_extension:
    name: Adyen Test Cards (Chrome extension)
    purpose: Autofill test cards into Web Drop-in / Components in the browser.
  android_app:
    name: Adyen Test Cards Android app
    source: https://github.com/Adyen
    purpose: Access test cards for Android Drop-in / Components on device.
  test_cards_api:
    name: Test Cards API
    baseURL: https://ca-test.adyen.com
    openapi: openapi/test-cards-openapi-original.yml
    purpose: Programmatically generate custom test card numbers bound to specific outcomes.

alternative_payment_methods:
  docs: https://docs.adyen.com/development-resources/test-cards-and-credentials/alternative-payment-method-credentials
  note: Test credentials for iDEAL, PayPal, Klarna, SEPA, and other APMs are published per method.
